[project]
name = "deepeval-mvp"
version = "0.1.0"
description = "service for evaluating LLM output"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepeval>=3.8.1,<4",
    "ollama>=0.6.1,<1",
    "openai>=1.0.0,<2",
    "pymongo>=4.16.0,<5",
    "python-dotenv>=1.2.1,<2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning",
]
env_files = [".env"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: dry-run integration flow with mocks",
  "system: live run against real model backend",
]



[tool.poe.tasks]
# Basic usage task for running as a service
service = "uv run python -m deepeval_mvp.main"

# Lint
lint = "uv run ruff check src/ tests/"
lint-fix = "uv run ruff check --fix src/ tests/"

[tool.poe.tasks.demo]
cmd = "uv run pytest -q -s tests/test_service.py::test_demo_full_system_fixture_flow_prints_progress"
env = { RUN_SYSTEM = "1", STREAM_EVAL_OUTPUT = "true" }

[tool.poe.tasks.demo-dry]
cmd = "uv run pytest -q -s tests/test_service.py::test_service_full_fixture_scan_with_stubbed_pipeline"

[tool.poe.tasks.test]
cmd = "uv run pytest -q -m 'not integration and not system'"

[tool.poe.tasks.test-v]
cmd = "uv run pytest -vv -s -m 'not integration and not system'"

[tool.poe.tasks.test-cov]
cmd = "uv run pytest -q -m 'not integration and not system' --cov=src --cov-report=term-missing"

[tool.poe.tasks.test-all]
cmd = "uv run pytest -q"
env = { RUN_SYSTEM = "1" }

[tool.poe.tasks.test-integration]
cmd = "uv run pytest -q -m 'integration and not system'"

[tool.poe.tasks.test-system]
cmd = "uv run pytest -q -m system"
env = { RUN_SYSTEM = "1" }


[tool.coverage.run]
omit = [
  "src/deepeval_mvp/main.py",
]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501",   # line length handled by formatter
  "SIM108", # ternary operator — readability preference
]

[tool.ruff.lint.isort]
known-first-party = ["deepeval_mvp"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true


[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.0",
]
