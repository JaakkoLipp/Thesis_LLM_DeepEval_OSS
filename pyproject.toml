[project]
name = "deepeval-mvp"
version = "0.1.0"
description = "service for evaluating LLM output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.8.1",
    "ollama>=0.6.1",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning",
]
env_files = [".env"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: dry-run integration flow with mocks",
  "system: live run against real model backend",
]



[tool.poe.tasks]
# Basic usage task for running as a service
service = "uv run python -m deepeval_mvp.main"

[tool.poe.tasks.demo]
cmd = "uv run pytest -q -s tests/test_service.py::test_demo_full_system_fixture_flow_prints_progress"
env = { RUN_SYSTEM = "1" }

[tool.poe.tasks.demo-dry]
cmd = "uv run pytest -q -s tests/test_service.py::test_demo_full_integration_fixture_flow_dry_run"

[tool.poe.tasks.test]
cmd = "uv run pytest -q -m 'not integration and not system'"

[tool.poe.tasks.test-v]
cmd = "uv run pytest -vv -s -m 'not integration and not system'"

[tool.poe.tasks.test-cov]
cmd = "uv run pytest -q -m 'not integration and not system' --cov=src --cov-report=term-missing"

[tool.poe.tasks.test-all]
cmd = "uv run pytest -q"
env = { RUN_SYSTEM = "1" }

[tool.poe.tasks.test-integration]
cmd = "uv run pytest -q -m 'integration and not system'"

[tool.poe.tasks.test-system]
cmd = "uv run pytest -q -m system"
env = { RUN_SYSTEM = "1" }


[tool.coverage.run]
omit = [
  "src/deepeval_mvp/main.py",
]


[dependency-groups]
dev = [
    "poethepoet>=0.41.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.15.1",
]
